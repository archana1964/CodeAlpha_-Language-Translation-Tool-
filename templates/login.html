{% extends "base.html" %}
{% block title %}Login | LinguaBridge{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="globe">🌐</div>
  <h1>Welcome back</h1>
  <p class="muted">Log in to translate between languages.</p>
  <form method="POST">
    <label>Username or email</label>
    <input name="identity" type="text" placeholder="Enter username or email" required autocomplete="username">
    <label>Password</label>
    <input name="password" type="password" placeholder="Enter password" required autocomplete="current-password">
    <button class="primary full" type="submit">Login</button>
  </form>
  <p class="switch">Don't have an account? <a href="{{ url_for('register') }}">Create account</a></p>
</section>
{% endblock %}
